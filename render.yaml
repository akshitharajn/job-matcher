services:
  - type: web
    name: job-matcher
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false   # you enter this in the Render dashboard; never commit it
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LIVE_JOBS
        value: "1"
      - key: MAX_LIVE_JOBS
        value: "150"   # the free tier has 0.1 CPU / 512 MB RAM
